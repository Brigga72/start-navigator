<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0071ce">
<title>Updating Cruise Navigator</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f7;color:#17212b;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{max-width:420px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.12);text-align:center}
h1{margin:.2rem 0 .5rem;font-size:28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#0071ce}.note{color:#586879;line-height:1.5}.status{margin:20px 0;padding:14px;border-radius:14px;background:#f2f6fa;font-weight:700}.btn{display:inline-block;margin-top:10px;background:#0071ce;color:#fff;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:16px}
</style>
</head>
<body>
<div class="card">
<div class="eyebrow">CRUISE NAVIGATOR</div>
<h1>Updating the app…</h1>
<p class="note">This one-time cleanup removes the older cached app so the newest version can load correctly.</p>
<div class="status" id="status">Preparing a clean update…</div>
<button class="btn" id="manual" type="button" hidden>Continue to Cruise Navigator</button>
</div>
<script>
(async function(){
  const status=document.getElementById('status');
  const manual=document.getElementById('manual');
  function go(){
    const u=new URL('./index.html', location.href);
    u.searchParams.set('fresh', Date.now());
    location.replace(u.href);
  }
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){try{await reg.unregister()}catch(e){}}
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('cruise-nav-')||k.startsWith('star-nav-')).map(k=>caches.delete(k)));
    }
    status.textContent='Old app cache cleared. Loading the newest version…';
    setTimeout(go,250);
  }catch(e){
    status.textContent='Automatic cleanup was blocked. Use the button below.';
    manual.hidden=false;
  }
  setTimeout(()=>{manual.hidden=false},5000);
  manual.onclick=go;
})();
</script>
</body>
</html>
